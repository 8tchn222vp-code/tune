<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>とび森 美術品コンプ</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;margin:0;background:#f6f3ea;color:#333}
header{position:sticky;top:0;background:#fff;padding:16px;box-shadow:0 2px 8px #0001;z-index:2}
h1{font-size:20px;margin:0 0 8px}.bar{height:10px;background:#ddd;border-radius:8px;overflow:hidden}.fill{height:100%;background:#4caf50;width:0}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button,.filter button{border:0;border-radius:10px;padding:9px 12px;background:#eee}.active{background:#333!important;color:white}
#count{font-weight:700}.filter{padding:12px;display:flex;gap:8px;flex-wrap:wrap}input{padding:10px;border:1px solid #ccc;border-radius:10px;flex:1;min-width:180px}
main{padding:0 12px 30px}.item{background:#fff;border-radius:14px;padding:13px;margin:8px 0;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px #0000000d}
.item input{flex:0 0 auto;min-width:0;width:22px;height:22px}.name{font-weight:700}.meta{font-size:12px;color:#777;margin-top:3px}.tip{display:none;margin-top:8px;font-size:13px;color:#555}.show .tip{display:block}
.small{font-size:12px;color:#777}
</style>
</head>
<body>
<header>
<h1>🖼️ とび森 美術品コンプ</h1>
<div id="count">0 / 33</div><div class="bar"><div class="fill" id="fill"></div></div>
<div class="tabs"><button class="active" onclick="tab('all',this)">全部</button><button onclick="tab('paint',this)">名画</button><button onclick="tab('sculpt',this)">彫刻</button></div>
</header>
<div class="filter"><input id="q" placeholder="美術品を検索…"><button onclick="clearAll()">チェック全解除</button></div>
<main id="list"></main>
<script>
const data=[
["paint","いきなめいが","偽物なし"],["paint","おごそかなめいが","本物：奥の男性の手がカーテンの向こう"],["paint","おちついためいが","本物：牛乳の量が少ない"],["paint","いさましいめいが","本物：前髪がM字"],["paint","ゆうめいなめいが","本物：モナ・リザの手の形が正しい"],["paint","すばらしいめいが","偽物なし"],["paint","すごいめいが","本物：中央の人物が帽子をかぶっている"],["paint","いいめいが","偽物なし"],["paint","きれいなめいが","本物：貝殻の首飾りがない"],["paint","よくみるめいが","偽物なし"],["paint","たぐいまれなるめいが","偽物なし"],["paint","いいかんじのめいが","偽物なし"],["paint","おもしろいめいが","本物：胸に花がある"],["paint","たいへんなめいが","本物：人物の顔が正しい"],["paint","いなせなめいが","本物：眉が上がっている"],["paint","にぎやかなめいが","偽物なし"],["paint","うまいめいが","本物：果物籠の中身が正しい"],["paint","かちのあるめいが","偽物なし"],["paint","おだやかなめいが","偽物なし"],["paint","ちからづよいめいが","偽物なし"],["paint","すてきなめいが","本物：少女の耳飾りがない"],["paint","たおやかなめいが","本物：女性が右向き"],["paint","みごとなめいが","本物：中央の人物の服が正しい"],["paint","あらぶるめいが","本物：風神雷神図の配置が正しい"],["paint","しなやかなめいが","本物：見返り美人が右向き"],
["sculpt","いだいなちょうこく","本物：右手の手のひらが上"],["sculpt","いにしえのちょうこく","本物：目がほぼ閉じている"],["sculpt","うつくしいちょうこく","本物：髪を後ろで一つにまとめている"],["sculpt","こうごうしいちょうこく","本物：翼が羽毛の翼"],["sculpt","しんぴてきなちょうこく","本物：帽子が正しい形"],["sculpt","たくましいちょうこく","本物：腕に余計なものがない"],["sculpt","ぼせいあふれるちょうこく","本物：舌が出ていない"],["sculpt","りりしいちょうこく","本物：右手に何も持っていない"]
];
let mode="all", state=JSON.parse(localStorage.getItem("tobimori-art")||"{}");
function render(){let q=document.getElementById("q").value.trim();let arr=data.filter(x=>(mode==="all"||x[0]===mode)&&x[1].includes(q));let el=document.getElementById("list");el.innerHTML="";
arr.forEach((x,i)=>{let key=data.indexOf(x), checked=!!state[key];let d=document.createElement("div");d.className="item"+(checked?"":"");d.innerHTML=`<input type="checkbox" ${checked?"checked":""}><div><div class="name">${x[1]}</div><div class="meta">${x[0]==="paint"?"名画":"彫刻"} ・ ${x[2]}</div></div>`;d.querySelector("input").onchange=e=>{state[key]=e.target.checked;localStorage.setItem("tobimori-art",JSON.stringify(state));update()};el.appendChild(d)}) ;update()}
function update(){let n=Object.values(state).filter(Boolean).length;document.getElementById("count").textContent=`${n} / 33`;document.getElementById("fill").style.width=(n/33*100)+"%"}
function tab(m,b){mode=m;document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function clearAll(){if(confirm("全部のチェックを外す？")){state={};localStorage.setItem("tobimori-art","{}");render()}}
document.getElementById("q").oninput=render;render();
</script>
</body></html>
